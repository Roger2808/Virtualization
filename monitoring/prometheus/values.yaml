grafana:
  enabled: false

alertmanager:
  enabled: false

prometheus:
  enabled: true
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 3d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true
