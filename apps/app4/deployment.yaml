apiVersion: apps/v1
kind: Deployment
metadata:
  name: app4
  namespace: parcial-rlmr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app4
  template:
    metadata:
      labels:
        app: app4
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:latest
          ports:
            - containerPort: 80