apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app1-route
  namespace: parcial-rlmr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`app1.local`)
      kind: Rule
      services:
        - name: app1
          port: 80
